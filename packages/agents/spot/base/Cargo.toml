[package]
name = "spot-base"
description = "Holds WETH at a fixed weight against USDC on Base, rebalancing when it drifts outside its band"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The same agent as `spot`, the same source: only the manifest beside this
# file differs (the vault's chain, and the driver it names on that chain).
[lib]
crate-type = ["cdylib", "rlib"]
path = "../src/lib.rs"

[dependencies]
futures.workspace = true
serde.workspace = true
shonin-strategy-sdk.workspace = true

[lints]
workspace = true
