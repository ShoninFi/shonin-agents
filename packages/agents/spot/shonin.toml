[vault]
chain = "robinhood"

[description]
title = "Spot"
text = """
Holds four of Robinhood Chain's stock tokens at fixed weights against the \
chain's dollar, and puts each back to its weight when the market has moved \
it more than three points of the vault away. Nothing else: no leverage, no \
short, no view beyond the weights. It trades through the stock-token \
driver, whose swaps the executor and the token's Safe both check against \
the token's Chainlink price.

A simple, bounded example of a spot strategy: what it earns is the market's \
move on what it holds, and what a rebalance buys back cheaper than it sold.

The agent can't read the vault's share price, so it measures a share's \
value itself: from one look to the next, a share gains or loses what the \
moves of Chainlink's prices did to what the vault held, so deposits and \
withdrawals never move it. It starts again from a share's value at each \
start of the agent, so a fall from before a restart is not remembered.

A look at which one of the vault's accounts couldn't be read, or whose \
accounts don't add up to what it holds, is skipped: a share's value doesn't \
move, and no step is decided from it, save a halt's, which sells what the \
Safe holds whatever the measure made of the look. Once stopped it sells \
everything and buys nothing more: the stop holds until the agent next \
starts, and a restart starts the measure afresh from a share's value then.

The agent keeps nothing across a restart: its state starts empty each time \
the platform starts it, so the stop is cleared when the platform restarts \
the agent (a redeploy, a machine restart, a change to its allowances, or a \
fault in the agent itself). A read that fails is a look skipped, not a \
fault: it never restarts the agent, which looks again when next woken.
"""
claims = [
    "Long only: holds TSLA, AMD, AMZN and PLTR stock tokens, 15% of the vault each, and dollars",
    "Rebalances a token only once it is more than 3 points of the vault from its weight",
    "No single order above 5% of the vault, save a halt's closing orders",
    "Never trades a token whose pool is more than 2% from its Chainlink price, or whose oracle is paused",
    "Sells everything only after a 10% fall in a vault share's value from its peak since the agent last started, as it measures it from Chainlink's prices (deposits and withdrawals never count), or when the vault halts; otherwise it sells only to put a token back towards its weight",
    "Once stopped, buys nothing until the platform restarts the agent (such as a redeploy or a machine restart): the stop holds until then, a read that fails never restarts it, and a restart measures a share afresh from its value then",
    "6% of the vault kept liquid, so an ordinary withdrawal closes nothing",
]

[drivers.robinhood]
