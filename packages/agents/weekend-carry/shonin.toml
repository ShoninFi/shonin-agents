[vault]
chain = "robinhood"

[description]
title = "Weekend carry"
text = """
Robinhood's stock tokens trade all weekend, but the stock market behind them \
and the channel that creates and redeems them do not. From Friday evening to \
Monday's open nothing pulls a token back to its stock, and the perpetual on \
the same stock drifts with the weekend's flow. When the perpetual trades \
above the token, this agent holds the token and shorts the perpetual in \
equal shares, and carries the pair into Monday, when the gap usually closes.

The position has no view on the stock: the token and the short move \
together. What can go wrong is the gap widening before it closes, funding \
turning against the short, and a weekend market too thin to leave at a \
good price; the limits below are what bound it.

The agent can't read the vault's share price, so it measures a share's \
value itself: from one look to the next, a share gains or loses what the \
moves of the tokens' Chainlink prices and of the perpetuals' books did to \
what the vault held (funding and trading costs are not counted), so \
deposits and withdrawals never move it. \
It starts again from a share's value at each start of the agent, so \
a fall from before a restart is not remembered.

A look at which one of the vault's accounts couldn't be read, or whose \
accounts don't add up to what it holds, is skipped: a share's value doesn't \
move, and no step is decided from it, save a halt's, which closes what the \
vault holds whatever the measure made of the look, but never sells a token \
while what is shorted against it can't be read. Once stopped it closes \
both legs and opens nothing more: the stop holds until the agent next \
starts, and a restart starts the measure afresh from a share's value then.

On a halt it waits for a book of every perpetual the vault holds something \
of, and for Lighter's positions, before it counts anything closed, and \
closes what it can see meanwhile; it never ends the halt as done while \
something held is unpriced.

The agent keeps nothing across a restart: its state starts empty each time \
the platform starts it, so the stop is cleared when the platform restarts \
the agent: a redeploy, a machine restart, a change to its allowances, its \
tank topped up after running dry, a handover to another executor, or a \
fault in the agent itself. A read that fails is a look skipped, not a \
fault: it never restarts the agent, which looks again when next woken. \
Within a halt it looks again after a pause, and a halt that still can't \
read what the vault holds ends in error rather than as done, so the \
platform starts the agent again within the halt's grace.
"""
claims = [
    "Gross exposure at most twice the vault's value",
    "No single order above 5% of the vault, save a halt's closing orders",
    "Three underlyings only: SPY, QQQ and NVDA, as stock tokens and as Lighter perpetuals",
    "Both legs cut together after a 10% fall in a vault share's value from its peak since the agent last started, as it measures it from the tokens' Chainlink prices and the perpetuals' books: deposits and withdrawals never count",
    "Once cut, opens nothing until the platform restarts the agent (such as a redeploy or a machine restart): the stop holds until then, a read that fails outside a halt never restarts it, and a restart measures a share afresh from its value then",
    "Unwinds the perpetual first and the token second, never leaving a naked short",
    "6% of the vault kept liquid, so an ordinary withdrawal closes nothing",
]

[drivers.robinhood]

[drivers.lighter]
