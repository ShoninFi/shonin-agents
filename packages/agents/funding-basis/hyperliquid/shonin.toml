[vault]
chain = "hyperliquid"

[description]
title = "Funding basis on Hyperliquid"
text = """
Holds the spot asset on Hyperliquid and shorts its perpetual against it, so \
the position has no view on the price, and collects the funding the shorts \
are paid while the perpetual trades above the spot. Both legs sit in one \
account the vault's own contract controls, which the trading key can trade \
but never withdraw from. When funding falls far enough it unwinds, and when \
a vault share's value falls far enough from its peak it closes out.

The edge is mechanical and it compresses as more capital chases it: the \
record shows the size it was earned at, and a larger vault should expect less.

The agent can't read the vault's share price, so it measures a share's \
value itself: from one look to the next, a share gains or loses what the \
moves of both legs' books, and the funding the account was paid or owed, \
did to what the vault held (trading costs are not counted), so deposits and \
withdrawals never move it. \
It starts again from a share's value at each start of the agent, so \
a fall from before a restart is not remembered.

Once stopped it closes both legs, bar at most one HYPE kept to pay for \
sends home, and opens nothing more: the stop holds until the agent next \
starts, and a restart starts the measure afresh from a share's value then.
"""
claims = [
    "Gross exposure at most twice the vault's value",
    "No single order above 5% of the vault, save a halt's closing orders",
    "6% of the vault kept liquid, so an ordinary withdrawal closes nothing",
    "Closes both legs, bar at most one HYPE kept to pay for sends home, after a 10% fall in a vault share's value from its peak since the agent last started, as it measures it from both legs' books and the funding paid: deposits and withdrawals never count",
    "Once stopped, opens nothing until the agent restarts: the stop holds until then, and a restart measures a share afresh from its value then",
    "One pair, HYPE spot against the HYPE perpetual, and nothing else",
]

[drivers.hyperliquid]
