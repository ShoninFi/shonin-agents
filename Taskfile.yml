# The bots: strategies published to a running Shonin platform.
version: "3"
silent: true
dotenv: [".env"]

# `.env` is read into every command's environment, so the settings are read
# there rather than into Task's own variables: a variable computed with `sh:`
# runs before the file is loaded and would always come back empty.

tasks:
  default:
    cmds:
      - task --list

  setup:
    desc: "Install the toolchain, enable the commit guard, and point the SDK at a local platform"
    cmds:
      - rustup show active-toolchain || rustup toolchain install
      - git config core.hooksPath .githooks
      - |
        for bin in cargo gitleaks claude jq; do
          command -v "$bin" >/dev/null || echo "missing: $bin (see README.md)"
        done
        for f in .private/terms.txt .private/review.md; do
          [ -f "$f" ] || echo "missing: $f (commit guard input; commits are blocked until it exists)"
        done
      - task: patch

  patch:
    desc: "Point the SDK at a local platform checkout (SHONIN_PLATFORM_DIR)"
    cmds:
      - |
        if [ -z "${SHONIN_PLATFORM_DIR:-}" ]; then
          echo "SHONIN_PLATFORM_DIR is unset: the SDK resolves from the registry."
          rm -f .cargo/config.toml
          exit 0
        fi
        mkdir -p .cargo
        cat > .cargo/config.toml <<EOF
        # Written by \`task patch\`; gitignored. The SDK is declared by version
        # in Cargo.toml and resolved from a checkout while the two move together.
        [patch.crates-io]
        shonin-strategy-sdk = { path = "${SHONIN_PLATFORM_DIR}/packages/strategy-sdk" }
        EOF
        echo "SDK patched to {{.PLATFORM_DIR}}"

  build:
    desc: "Build every bot as a component"
    cmds:
      - cargo build --release --locked --target wasm32-wasip2 -p funding-basis

  publish:
    desc: "Publish a bot to a running platform (BOT=funding-basis)"
    vars:
      BOT: '{{.BOT | default "funding-basis"}}'
    cmds:
      # The platform's own command does the publishing. A checkout of the
      # platform runs it from there, so nothing has to be installed first;
      # otherwise it has to be on the path.
      - |
        api="${SHONIN_API_URL:-http://localhost:19081}"
        rpc="${SHONIN_RPC_URL:-http://localhost:19083}"
        if [ -n "${SHONIN_PLATFORM_DIR:-}" ]; then
          cargo run -q --manifest-path "${SHONIN_PLATFORM_DIR}/Cargo.toml" -p shonin-cli -- \
            --api "$api" --rpc-url "$rpc" \
            --deployments "${SHONIN_PLATFORM_DIR}/.shonin/local/deployments.json" \
            publish "$PWD/packages/bots/{{.BOT}}"
        elif command -v shonin >/dev/null; then
          shonin --api "$api" --rpc-url "$rpc" publish "packages/bots/{{.BOT}}"
        else
          echo "No shonin command: set SHONIN_PLATFORM_DIR to a platform checkout, or put shonin on the path."
          exit 1
        fi

  dev:
    desc: "Publish funding-basis to a platform running locally and follow the build"
    cmds:
      - task: publish

  check:
    desc: "Compile every crate, natively and as a component"
    cmds:
      - cargo check --workspace --all-targets
      - cargo check -p funding-basis --target wasm32-wasip2

  lint:
    desc: "rustfmt --check and clippy -D warnings"
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo clippy -p funding-basis --target wasm32-wasip2 -- -D warnings

  fmt:
    desc: "Format every crate"
    cmds:
      - cargo fmt --all

  test:
    desc: "Native tests"
    cmds:
      - cargo test --workspace

  clean:
    cmds:
      - cargo clean
